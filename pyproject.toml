[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bafang-motor-calibration"
dynamic = ["version"]
description = "Calibrate Bafang M620 (G510) mid-drive motors over a USB-UART cable, replacing the C961 calibration display."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Bafang-Motor-Calibration contributors" }]
keywords = ["bafang", "m620", "g510", "ultra", "ebike", "calibration", "uart", "c961"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/jjuhala/Bafang-Motor-Calibration"
Documentation = "https://github.com/jjuhala/Bafang-Motor-Calibration#readme"
Issues = "https://github.com/jjuhala/Bafang-Motor-Calibration/issues"
Changelog = "https://github.com/jjuhala/Bafang-Motor-Calibration/blob/main/CHANGELOG.md"

[project.scripts]
bafang-cal = "bafang_cal.cli:main"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
# mypy also checks the tests, so it needs pytest's type information.
lint = [{ include-group = "test" }, "ruff>=0.6", "mypy>=1.11", "types-pyserial>=3.5"]
dev = [{ include-group = "lint" }, "intelhex>=2.3"]

[tool.hatch.version]
path = "src/bafang_cal/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "tools", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/bafang_cal"]

# --------------------------------------------------------------------- tools

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "RET",     # return
    "PT",      # pytest style
    "RUF",     # ruff-specific
]
ignore = [
    "RUF001",  # ambiguous unicode characters (we print °C)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Comparing module constants against expected literals is the point of the tests.
"tests/*" = ["SIM300"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "tools"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["intelhex", "intelhex.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["bafang_cal"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\.$"]
